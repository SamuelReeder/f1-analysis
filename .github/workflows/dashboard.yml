name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'f1rank/**'
      - 'data/processed/**'
      - 'outputs/**'
      - 'tests/test_dashboard.py'
      - '.github/workflows/dashboard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'f1rank/**'
      - 'data/processed/**'
      - 'outputs/**'
      - 'tests/test_dashboard.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install publishing dependencies
        run: python -m pip install -r dashboard/requirements.txt
      - name: Verify exports and assemble the publication
        run: |
          python -m f1rank.dashboard publish
          python -m pytest tests/test_dashboard.py -q
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard
      - name: Build for the repository URL
        run: npm --prefix dashboard run build -- --base=/f1-analysis/
      - name: Install browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Check the actual static site, including its repository URL prefix
        working-directory: dashboard
        env:
          DASHBOARD_TEST_URL: http://127.0.0.1:4180/f1-analysis/
        run: npm test -- --workers=2
      - name: Upload checked website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
